- file: "photo1.png"
  title: "Alexandra Park Peacewall"
  alt: "Only park in Western Europe known to be divided by a physical barrier. This specific peacewall was erected in 1994 to prevent violence between Loyalist/Unionist and Republican/Nationalist communities."
  date: "2013"
  source: "BBC Archive"

- file: "photo2.png"
  title: "Park Employee Closing Alexandra Park Peacewall Gate for the Night"
  alt: "In 2011, a gate was installed into the wall to link the two sides of the park, and as of 2026 this gate remains open full time."
  date: "2013"
  source: "BBC Archive"
